[package]
name = "baccarat-engine"
version = "0.1.0"
edition = "2021"
description = "Punto banco (baccarat) rules engine with paytables verified by exhaustive enumeration of every reachable coup. Commission and EZ settlement, eleven side bets, and all five pit scoreboards."
license = "MIT"
repository = "https://github.com/SabienNguyen/baccarat-sim"
homepage = "https://sabiennguyen.github.io/baccarat-sim/"
documentation = "https://docs.rs/baccarat-engine"
readme = "README.md"
keywords = ["baccarat", "casino", "punto-banco", "card-game", "gambling"]
categories = ["games", "game-development", "simulation"]

[features]
wasm = ["dep:tsify-next", "dep:wasm-bindgen"]

[dependencies]
rand = "0.8"
rand_chacha = "0.3"
serde = { version = "1", features = ["derive"] }
tsify-next = { version = "0.5", optional = true }
wasm-bindgen = { version = "0.2", optional = true }

[dev-dependencies]
serde_json = "1"
